<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>紀念 謝純昌 · 樣本頁</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #2c2a26;
      --muted: #6b6560;
      --line: #ddd4c8;
      --card: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Serif TC", "Songti TC", "PingFang TC", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    header {
      text-align: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1.75rem;
      margin-bottom: 2rem;
    }
    .portrait {
      width: min(100%, 28rem);
      margin: 0 auto 1.5rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #efe8de;
      box-shadow: 0 10px 28px rgba(44, 42, 38, 0.08);
    }
    .portrait img {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
    }
    .eyebrow {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    h1 {
      font-weight: 600;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      margin: 0 0 0.5rem;
    }
    .aka {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.35rem;
      margin: 1.25rem 0;
    }
    h2 {
      font-size: 1.05rem;
      margin: 0 0 0.6rem;
    }
    p { margin: 0 0 0.85rem; }
    ul { margin: 0; padding-left: 1.2rem; color: var(--muted); }
    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <figure class="portrait">
        <img src="portrait.jpg" alt="謝純昌於櫻花道回眸" width="1600" height="2133" />
      </figure>
      <p class="eyebrow">Sample memorial page</p>
      <h1>紀念 謝純昌</h1>
      <p class="aka">謝老師 · Chun-cheong</p>
    </header>

    <section class="card">
      <h2>這是樣本頁</h2>
      <p>此頁放在 GitHub 帳號 <strong>tsesirdaniel</strong>，方便之後改成正式紀念站或投影內容。生卒年份、訃聞與更多相片可再補上。</p>
    </section>

    <section class="card">
      <h2>可稍後填入</h2>
      <ul>
        <li>生卒年份</li>
        <li>追思會場地與時間</li>
        <li>更多精選相片</li>
        <li>親友留言</li>
      </ul>
    </section>

    <footer>靜靜紀念 · 樣本草稿</footer>
  </main>
</body>
</html>
